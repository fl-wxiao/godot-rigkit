name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot (headless)
        run: |
          mkdir -p ~/godot
          if [ ! -x ~/godot/godot ]; then
            curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
            chmod +x ~/godot/godot
          fi

      - name: Import project (builds the class cache)
        run: ~/godot/godot --headless --path . --import

      - name: Acceptance suite
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd
