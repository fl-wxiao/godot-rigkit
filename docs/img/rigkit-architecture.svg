<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1290" viewBox="0 0 1680 1290">
<defs><style><![CDATA[
text{font-family:"PingFang SC","Helvetica Neue",sans-serif;}
.t{font-size:34px;font-weight:700;fill:#e9eef6;}
.s{font-size:15.5px;fill:#9aa6b6;}
.h{font-size:15px;font-weight:600;letter-spacing:1px;}
.c{font-size:17px;font-weight:600;fill:#e9eef6;}
.b{font-size:13px;fill:#9aa6b6;}
.n{font-size:12px;fill:#9aa6b6;}
]]></style></defs>
<rect width="1680" height="1290" fill="#171b22"/>
<text class="t" x="70" y="74">RigKit 0.6.2 · Godot 4 运行时骨骼工具包</text>
<text class="s" x="70" y="104">MIT · 纯 GDScript · 无第三方依赖 · 252 断言全绿 · 4 个骨架适配器 · 只写旋转与位移，从不缩放</text>
<rect x="60" y="130" width="1560" height="210" rx="14" fill="#20252f" stroke="#2f3743"/>
<rect x="60" y="130" width="6" height="210" rx="3" fill="#4e9df2"/>
<text class="h" x="86" y="161" fill="#4e9df2">① 骨架接入层 · BoneSource 契约（唯一需要你实现的东西）</text>
<text class="b" x="86" y="196">读：get_origin · get_world_dir · get_parent_global_rotation · get_length　　写：set_world_dir（旋转）· set_origin（位移，可拒绝）</text>
<text class="n" x="86" y="219">接口不提供缩放 → 骨骼长度是常量 → “零拉伸”由接口形状保证，不靠事后断言</text>
<rect x="76" y="240" width="354.0" height="88" rx="9" fill="#262d38" stroke="#4e9df2" stroke-opacity="0.5"/>
<text class="c" x="92" y="270">Node2DBoneSource</text>
<text class="b" x="92" y="296">Godot 原生 Skeleton2D / Bone2D</text>
<text class="n" x="92" y="314">膝向启发式推算 dir_offset</text>
<rect x="454.0" y="240" width="354.0" height="88" rx="9" fill="#262d38" stroke="#4e9df2" stroke-opacity="0.5"/>
<text class="c" x="470.0" y="270">SpineBoneSource</text>
<text class="b" x="470.0" y="296">spine-godot 等 Spine 运行时</text>
<text class="n" x="470.0" y="314">rotation_is_degrees：度↔弧度换算</text>
<rect x="832.0" y="240" width="354.0" height="88" rx="9" fill="#262d38" stroke="#4e9df2" stroke-opacity="0.5"/>
<text class="c" x="848.0" y="270">RigbyBoneSource</text>
<text class="b" x="848.0" y="296">烬塔客户端 Rigby2D（Rust 扩展）</text>
<text class="n" x="848.0" y="314">按骨名寻址 · dir_offset 恒 0 · probe()</text>
<rect x="1210.0" y="240" width="354.0" height="88" rx="9" fill="#262d38" stroke="#4e9df2" stroke-opacity="0.5"/>
<text class="c" x="1226.0" y="270">DictBoneSource</text>
<text class="b" x="1226.0" y="296">程序化骨架 / 数据驱动 / 测试替身</text>
<text class="n" x="1226.0" y="314">字典骨骼，零引擎依赖</text>
<rect x="60" y="356" width="1560" height="268" rx="14" fill="#20252f" stroke="#2f3743"/>
<rect x="60" y="356" width="6" height="268" rx="3" fill="#2fc2ac"/>
<text class="h" x="86" y="387" fill="#2fc2ac">② 求解内核 · 只算出“该朝哪转”，不碰像素</text>
<rect x="76" y="402" width="485.3333333333333" height="104" rx="9" fill="#262d38" stroke="#2fc2ac" stroke-opacity="0.5"/>
<text class="c" x="92" y="432">TwoBoneIK</text>
<text class="b" x="92" y="458">双骨解析解 · 膝/肘方向可选</text>
<text class="b" x="92" y="478">pole 向量 + bend_sign 覆盖</text>
<text class="b" x="92" y="498">不可达 → 夹目标，不拉骨</text>
<rect x="585.3333333333333" y="402" width="485.3333333333333" height="104" rx="9" fill="#262d38" stroke="#2fc2ac" stroke-opacity="0.5"/>
<text class="c" x="601.3333333333333" y="432">ChainIK</text>
<text class="b" x="601.3333333333333" y="458">FABRIK 任意节数（尾/触手/绳）</text>
<text class="b" x="601.3333333333333" y="478">只写方向，长度恒定</text>
<text class="b" x="601.3333333333333" y="498">tip_dir 控制末端朝向</text>
<rect x="1094.6666666666665" y="402" width="485.3333333333333" height="104" rx="9" fill="#262d38" stroke="#2fc2ac" stroke-opacity="0.5"/>
<text class="c" x="1110.6666666666665" y="432">TwoBoneAim</text>
<text class="b" x="1110.6666666666665" y="458">瞄准专用双骨：手落到点</text>
<text class="b" x="1110.6666666666665" y="478">首帧从 FK 起算，限速不跳变</text>
<text class="b" x="1110.6666666666665" y="498">真实骨架实测 0.00px</text>
<rect x="76" y="512" width="485.3333333333333" height="104" rx="9" fill="#262d38" stroke="#2fc2ac" stroke-opacity="0.5"/>
<text class="c" x="92" y="542">GroundProbe</text>
<text class="b" x="92" y="568">双探针：脚跟 + 脚尖都要命中</text>
<text class="b" x="92" y="588">坡度跟随，倾角夹 ±20°</text>
<text class="b" x="92" y="608">尖峰滤波 + 帧数确认</text>
<rect x="585.3333333333333" y="512" width="485.3333333333333" height="104" rx="9" fill="#262d38" stroke="#2fc2ac" stroke-opacity="0.5"/>
<text class="c" x="601.3333333333333" y="542">PhysicsProbeSampler</text>
<text class="b" x="601.3333333333333" y="568">ShapeCast2D 圆扫描（非单射线）</text>
<text class="b" x="601.3333333333333" y="588">起点离地一个半径，避免误判</text>
<text class="b" x="601.3333333333333" y="608">强引用宿主，退出时 free</text>
<rect x="1094.6666666666665" y="512" width="485.3333333333333" height="104" rx="9" fill="#262d38" stroke="#2fc2ac" stroke-opacity="0.5"/>
<text class="c" x="1110.6666666666665" y="542">FootLock</text>
<text class="b" x="1110.6666666666665" y="568">四态机 LOCKED / BLEND / FK / DEGRADED</text>
<text class="b" x="1110.6666666666665" y="588">权重单调斜坡，无 0→1 跳变</text>
<text class="b" x="1110.6666666666665" y="608">双支撑窗口 + 丢地面降级</text>
<rect x="60" y="640" width="1560" height="250" rx="14" fill="#20252f" stroke="#2f3743"/>
<rect x="60" y="640" width="6" height="250" rx="3" fill="#f0b13c"/>
<text class="h" x="86" y="671" fill="#f0b13c">③ 约束族 · 可注册成顺序链：后一个读前一个写下的姿势</text>
<rect x="76" y="686" width="294.4" height="152" rx="9" fill="#262d38" stroke="#f0b13c" stroke-opacity="0.5"/>
<text class="c" x="92" y="716">AimConstraint</text>
<text class="b" x="92" y="742">方向瞄准 + 角度范围限幅</text>
<text class="b" x="92" y="762">max_speed 限速</text>
<text class="b" x="92" y="782">weight 0 = 原样</text>
<rect x="384.4" y="686" width="294.4" height="152" rx="9" fill="#262d38" stroke="#f0b13c" stroke-opacity="0.5"/>
<text class="c" x="400.4" y="716">TransformConstraint</text>
<text class="b" x="400.4" y="742">跟随 socket 旋转 / 位移</text>
<text class="b" x="400.4" y="762">smooth_time 平滑</text>
<text class="b" x="400.4" y="782">0 = 精确跟随</text>
<rect x="692.8" y="686" width="294.4" height="152" rx="9" fill="#262d38" stroke="#f0b13c" stroke-opacity="0.5"/>
<text class="c" x="708.8" y="716">PhysicsConstraint</text>
<text class="b" x="708.8" y="742">Spine 4.2 语义：inertia</text>
<text class="b" x="708.8" y="762">strength / damping / mass</text>
<text class="b" x="708.8" y="782">wind / gravity / limit / fps</text>
<rect x="1001.1999999999999" y="686" width="294.4" height="152" rx="9" fill="#262d38" stroke="#f0b13c" stroke-opacity="0.5"/>
<text class="c" x="1017.1999999999999" y="716">PathConstraint + RigPath</text>
<text class="b" x="1017.1999999999999" y="742">沿弧长曲线摆骨：发尾、布</text>
<text class="b" x="1017.1999999999999" y="762">position / ratio / rotate / mix</text>
<text class="b" x="1017.1999999999999" y="782">step_chain 按间距铺一串</text>
<rect x="1309.6" y="686" width="294.4" height="152" rx="9" fill="#262d38" stroke="#f0b13c" stroke-opacity="0.5"/>
<text class="c" x="1325.6" y="716">VerletChain</text>
<text class="b" x="1325.6" y="742">轻量 Verlet：距离约束</text>
<text class="b" x="1325.6" y="762">stiffness 回拉原动画姿势</text>
<text class="b" x="1325.6" y="782">永不拉伸，永远有限</text>
<text class="n" x="86" y="866" fill="#f0b13c">共同前提：动画系统每帧先写一次授权姿势。约束若读到自己上一帧的输出，惯性项会自我抵消，动作静默消失——披风“物理失效”实测只有 0.2° 滞后，就是这条。</text>
<rect x="60" y="906" width="1560" height="160" rx="14" fill="#20252f" stroke="#2f3743"/>
<rect x="60" y="906" width="6" height="160" rx="3" fill="#8fd0ff"/>
<text class="h" x="86" y="937" fill="#8fd0ff">④ 姿态数据与校验 · 不写骨骼，只回答“变了没有”</text>
<rect x="76" y="952" width="354.0" height="104" rx="9" fill="#262d38" stroke="#8fd0ff" stroke-opacity="0.5"/>
<text class="c" x="92" y="982">PoseSnapshot</text>
<text class="b" x="92" y="1008">capture / restore 任意骨集合</text>
<text class="b" x="92" y="1028">delta · max_angle · max_distance</text>
<text class="n" x="92" y="1042">按引用定位，字典骨不会被写坏键</text>
<rect x="454.0" y="952" width="354.0" height="104" rx="9" fill="#262d38" stroke="#8fd0ff" stroke-opacity="0.5"/>
<text class="c" x="470.0" y="982">MeshDeform</text>
<text class="b" x="470.0" y="1008">线性混合蒙皮（LBS）</text>
<text class="b" x="470.0" y="1028">bind_spine_vertices 直读 Spine 权重</text>
<text class="n" x="470.0" y="1042">自绘 Mesh / 权重离线校验</text>
<rect x="832.0" y="952" width="354.0" height="104" rx="9" fill="#262d38" stroke="#8fd0ff" stroke-opacity="0.5"/>
<text class="c" x="848.0" y="982">RootMotionAudit</text>
<text class="b" x="848.0" y="1008">根位移 vs 授权步幅</text>
<text class="b" x="848.0" y="1028">ok / fast / slow / stalled + 建议速率</text>
<text class="n" x="848.0" y="1042">只审计，不偷偷改动画</text>
<rect x="1210.0" y="952" width="354.0" height="104" rx="9" fill="#262d38" stroke="#8fd0ff" stroke-opacity="0.5"/>
<text class="c" x="1226.0" y="982">Params · Math · Types</text>
<text class="b" x="1226.0" y="1008">像素或米皆可（单位你定）</text>
<text class="b" x="1226.0" y="1028">角度规范化 / clamp_angle / 缓动</text>
<text class="n" x="1226.0" y="1042">共享类型与状态枚举</text>
<rect x="60" y="1082" width="1560" height="150" rx="14" fill="#20252f" stroke="#2f3743"/>
<rect x="60" y="1082" width="6" height="150" rx="3" fill="#63cf8a"/>
<text class="h" x="86" y="1113" fill="#63cf8a">⑤ 编排 · FootLockRig（唯一的 Node2D，塞进场景即可）</text>
<text class="b" x="86" y="1142">setup(source, bones, root, sampler)　·　add_constraint / remove / clear　·　set_root_audit　·　step(delta)　·　get_state()</text>
<text class="n" x="86" y="1168">每帧顺序固定：约束链写姿势 → 锁脚读 FK 并求解 → 审计吃最终状态。顺序错了就是“读到自己输出”。</text>
<text class="n" x="86" y="1194" fill="#63cf8a">调试：RigDebugDraw（骨骼线 / 探针 / 目标点）　·　demo.tscn 演示　·　--stats 遥测　·　headless 断言脚本</text>
<text class="n" x="70" y="1258">已验证真实骨架：player_rigby 15 骨 · chars_ranger 16 骨 · chars_ritual 14 骨 · 卡通 A-pose 20 骨（手误差 0.00px / 滑步 0.00px）　　仓库 github.com/fl-wxiao/godot-rigkit</text>
</svg>